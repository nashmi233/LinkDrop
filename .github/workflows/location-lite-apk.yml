name: Build Location Lite APK

on:
  workflow_dispatch:
  push:
    branches: [ location-lite-build ]
    paths:
      - 'location-lite/**'
      - '.github/workflows/location-lite-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: location-lite
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp location-lite/app/build/outputs/apk/debug/app-debug.apk Location-Lite-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Location-Lite-APK
          path: Location-Lite-v1.0.apk
          retention-days: 7
